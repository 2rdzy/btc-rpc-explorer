name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/bin/cli.js --help

  # the image has to keep building, and has to start (the command line help runs without a node)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t btc-rpc-explorer .
      - run: docker run --rm btc-rpc-explorer node dist/bin/cli.js --help
      - name: the image holds no settings
        run: docker run --rm --entrypoint sh btc-rpc-explorer -c 'test ! -e /workspace/.env && test "$(id -u)" != 0'

