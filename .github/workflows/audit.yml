name: audit

# Checks the packages that run in production for known vulnerabilities: every month, and when the dependencies change.
on:
  schedule:
    - cron: '17 6 1 * *'
  pull_request:
    paths: [package.json, npm-shrinkwrap.json]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
