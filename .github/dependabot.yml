# Version updates: a pull request a month per ecosystem, with the minor and patch updates of the npm packages grouped.
# (Security updates are separate and come when an advisory is published.)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
